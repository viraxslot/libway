name: Release — Publish

on:
  pull_request:
    types: [closed]

# Push the tag and create the GitHub Release with the built-in token.
permissions:
  contents: write

jobs:
  publish:
    name: Build and publish release
    # Only run when a release/* PR is actually merged (not just closed).
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # Check out main at the merge commit; full history for git-cliff.
          ref: main
          fetch-depth: 0

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Rust toolchain
        # Pin to the version in mise.toml so CI matches the local toolchain.
        uses: dtolnay/rust-toolchain@1.96

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure git identity for tagging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Reuse the publish script: it checks version sync, builds the .dmg,
      # generates notes, then (build having succeeded) tags and creates the
      # release. SKIP_BRANCH_PUSH=1 because the commit is already on main.
      - name: Build and publish
        env:
          GH_TOKEN: ${{ github.token }}
          SKIP_BRANCH_PUSH: "1"
        run: bash scripts/release-publish.sh
