name: CI

on:
  # Allow triggering the workflow manually from the Actions tab.
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
      - "docs/**"

# Only read access is needed — CI does not push, comment, or release.
permissions:
  contents: read

# Cancel an in-progress run when new commits are pushed to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: macos-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

  rust:
    name: Backend
    runs-on: macos-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v5

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      # Unit tests (lib + bins). nextest prints a single aggregated summary
      # line, unlike `cargo test` which reports per-binary.
      - name: Unit tests
        run: cargo nextest run --lib --bins

      # E2E tests (tests/e2e_*.rs): real IPC + in-memory DB, network faked.
      - name: E2E tests
        run: cargo nextest run -E 'test(/^e2e_/)'

      # nextest does not run doctests; cover them separately so they aren't
      # silently skipped if any get added later.
      - name: Doc tests
        run: cargo test --doc
